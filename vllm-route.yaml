
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vllm-route
  namespace: genai
spec:
  parentRefs:
  - name: vllm-gateway
    sectionName: http
  hostnames:
  - whatever.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: vllm
      port: 8000

