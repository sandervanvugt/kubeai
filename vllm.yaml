
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vllm-models
  namespace: genai
spec:
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 15Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: genai
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      # Prevent Kubernetes Service environment-variable
      # injection from conflicting with VLLM_PORT.
      enableServiceLinks: false

      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.11.0
          args:
            - "--model"
            - "Qwen/Qwen2.5-1.5B-Instruct"
            - "--max-model-len"
            - "2048"
            - "--gpu-memory-utilization"
            - "0.80"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"

          ports:
            - containerPort: 8000
              name: http

          env:
            - name: HF_HOME
              value: /models
            - name: HF_HUB_DISABLE_TELEMETRY
              value: "1"

          resources:
            requests:
              cpu: "2"
              memory: 8Gi
            limits:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: 1

          volumeMounts:
            - name: models
              mountPath: /models
            - name: dshm
              mountPath: /dev/shm

          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            failureThreshold: 120

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 30
            failureThreshold: 3

      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: vllm-models
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: genai
spec:
  selector:
    app: vllm
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000

