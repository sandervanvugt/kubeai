
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: genai
spec:
  replicas: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: vllm

  template:
    metadata:
      labels:
        app: vllm

    spec:
      # Avoid VLLM_PORT environment variable conflicts.
      enableServiceLinks: false

      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.11.0

          args:
            - "--model"
            - "Qwen/Qwen2.5-1.5B-Instruct"
            - "--max-model-len"
            - "2048"
            - "--gpu-memory-utilization"
            - "0.80"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"

          ports:
            - containerPort: 8000
              name: http

          env:
            - name: HF_HOME
              value: /models
            - name: HF_HUB_DISABLE_TELEMETRY
              value: "1"

          resources:
            requests:
              cpu: "2"
              memory: 8Gi
              ephemeral-storage: 5Gi
              nvidia.com/gpu: 1
            limits:
              cpu: "4"
              memory: 16Gi
              ephemeral-storage: 15Gi
              nvidia.com/gpu: 1

          volumeMounts:
            - name: models
              mountPath: /models

            - name: dshm
              mountPath: /dev/shm

          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            failureThreshold: 120

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 30
            failureThreshold: 3

      volumes:
        # Independent model cache for every Pod.
        # Uses node-local ephemeral storage, not RAM.
        - name: models
          emptyDir: {}

        # Shared memory required by vLLM.
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: genai
spec:
  type: ClusterIP

  selector:
    app: vllm

  ports:
    - name: http
      port: 8000
      targetPort: 8000

