
# Minimal Prometheus installation for GenAI lab

alertmanager:
  enabled: false

prometheus-pushgateway:
  enabled: false

prometheus-node-exporter:
  enabled: false

kube-state-metrics:
  enabled: true

server:
  persistentVolume:
    enabled: false

  retention: "2d"

  global:
    scrape_interval: 10s
    evaluation_interval: 10s

# Additional scrape configuration for vLLM
# This MUST be at the top level.

extraScrapeConfigs: |
  - job_name: 'vllm'
    scrape_interval: 10s
    metrics_path: /metrics

    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - genai

    relabel_configs:
      # Discover only Pods with app=vllm
      - source_labels:
          - __meta_kubernetes_pod_label_app
        action: keep
        regex: vllm

      # Scrape only port 8000
      - source_labels:
          - __meta_kubernetes_pod_container_port_number
        action: keep
        regex: "8000"

      # Add Kubernetes namespace label
      - source_labels:
          - __meta_kubernetes_namespace
        target_label: namespace

      # Add Kubernetes Pod label
      - source_labels:
          - __meta_kubernetes_pod_name
        target_label: pod

