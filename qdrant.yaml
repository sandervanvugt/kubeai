apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: genai
spec:
  selector:
    app: qdrant
  ports:
  - name: http
    port: 6333
    targetPort: 6333
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  namespace: genai
spec:
  serviceName: qdrant
  replicas: 1
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
    spec:
      securityContext:
        fsGroup: 1000
      containers:
      - name: qdrant
        image: qdrant/qdrant:v1.15.5
        ports:
        - containerPort: 6333
          name: http
        volumeMounts:
        - name: qdrant-storage
          mountPath: /qdrant/storage
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            memory: 2Gi
  volumeClaimTemplates:
  - metadata:
      name: qdrant-storage
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: qdrant-local
      resources:
        requests:
          storage: 5Gi

