
prometheus:
  url: http://prometheus-server.monitoring.svc
  port: 80

rules:
  default: false
  custom:
    - seriesQuery: 'vllm:num_requests_waiting{namespace!="",pod!=""}'
      resources:
        overrides:
          namespace:
            resource: namespace
          pod:
            resource: pod
      name:
        matches: '^vllm:num_requests_waiting$'
        as: 'vllm_requests_waiting'
      metricsQuery: |
        sum(vllm:num_requests_waiting{<<.LabelMatchers>>})
        by (<<.GroupBy>>)

